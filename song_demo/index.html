reading": "て", "pos": "助詞", "meaning": "接續助詞 (〜て形)"}, {"text": "い", "reading": "い", "pos": "動詞", "meaning": "處於 (原形：いる)"}, {"text": "た", "reading": "た", "pos": "助動詞", "meaning": "過去式助動詞"}, {"text": "の", "reading": "の", "pos": "助詞", "meaning": "表示原因或情況"}, {"text": "に", "reading": "に", "pos": "助詞", "meaning": "雖然...卻... (逆接)"}], "grammar": "「〜と同じように」表示「像〜一樣」。「〜ていたのに」表示「雖然做過〜但...」。"}, {"id": 6, "start": 43.35, "end": 48.115, "japanese": "気付けば少し滲んでいた", "chinese": "卻發現視線有些模糊了。", "words": [{"text": "気付け", "reading": "きづけ", "pos": "動詞", "meaning": "如果察覺、一旦發現 (原形：気付く)"}, {"text": "ば", "reading": "ば", "pos": "助詞", "meaning": "如果...就... (假定條件)"}, {"text": "少し", "reading": "すこし", "pos": "副詞", "meaning": "一點點、稍微"}, {"text": "滲ん", "reading": "にじんで", "pos": "動詞", "meaning": "滲出、模糊 (原形：滲む)"}, {"text": "で", "reading": "で", "pos": "助詞", "meaning": "接續助詞 (〜て形的一部分)"}, {"text": "い", "reading": "い", "pos": "動詞", "meaning": "處於 (原形：いる)"}, {"text": "た", "reading": "た", "pos": "助動詞", "meaning": "過去式助動詞"}], "grammar": "「〜ば」表示條件句。「〜ていた」表示動作持續或狀態持續。"}, {"id": 7, "start": 48.115, "end": 52.024, "japanese": "あなたの姿", "chinese": "你的身影。", "words": [{"text": "あなた", "reading": "あなた", "pos": "代名詞", "meaning": "你"}, {"text": "の", "reading": "の", "pos": "助詞", "meaning": "格助詞，表示所有格「的」"}, {"text": "姿", "reading": "すがた", "pos": "名詞", "meaning": "身影、姿態"}], "grammar": "「名詞１の名詞２」表示名詞１修飾名詞２的句型。此句為名詞片語。"}, {"id": 8, "start": 53.884, "end": 58.74, "japanese": "あれからいくつ夜を越えた", "chinese": "從那之後，熬過了多少個夜晚。", "words": [{"text": "あれ", "reading": "あれ", "pos": "代名詞", "meaning": "那個、那時"}, {"text": "から", "reading": "から", "pos": "助詞", "meaning": "從... (時間起點)"}, {"text": "いくつ", "reading": "いくつ", "pos": "疑問詞", "meaning": "幾個"}, {"text": "夜", "reading": "よる", "pos": "名詞", "meaning": "夜晚"}, {"text": "を", "reading": "を", "pos": "助詞", "meaning": "賓格助詞，表示動作對象"}, {"text": "越え", "reading": "こえ", "pos": "動詞", "meaning": "跨越 (原形：越える)"}, {"text": "た", "reading": "た", "pos": "助動詞", "meaning": "過去式助動詞"}], "grammar": "「〜から」表示起點。「いくつ〜を越える」詢問跨越了多少個「〜」。"}, {"id": 9, "start": 58.74, "end": 64.68, "japanese": "窓越しの白い画面に映った", "chinese": "映在窗外那片白茫茫的畫面裡，", "words": [{"text": "窓", "reading": "まど", "pos": "名詞", "meaning": "窗戶"}, {"text": "越し", "reading": "ごし", "pos": "名詞", "meaning": "隔著、越過"}, {"text": "の", "reading": "の", "pos": "助詞", "meaning": "格助詞，連接名詞修飾名詞"}, {"text": "白い", "reading": "しろい", "pos": "形容詞", "meaning": "白色的"}, {"text": "画面", "reading": "がめん", "pos": "名詞", "meaning": "畫面"}, {"text": "に", "reading": "に", "pos": "助詞", "meaning": "表示場所或對象"}, {"text": "映っ", "reading": "うつっ", "pos": "動詞", "meaning": "映照 (原形：映る)"}, {"text": "た", "reading": "た", "pos": "助動詞", "meaning": "過去式助動詞"}], "grammar": "「名詞＋越し」隔著。「〜に映る」映照在〜上。形容詞「白い」修飾名詞「画面」。"}, {"id": 10, "start": 64.68, "end": 69.367, "japanese": "あなたと見たい景色を今も", "chinese": "我至今仍舊，", "words": [{"text": "あなた", "reading": "あなた", "pos": "代名詞", "meaning": "你"}, {"text": "と", "reading": "と", "pos": "助詞", "meaning": "和、與 (表示共同行為的對象)"}, {"text": "見", "reading": "み", "pos": "動詞", "meaning": "看 (原形：見る)"}, {"text": "たい", "reading": "たい", "pos": "助動詞", "meaning": "希望、想要"}, {"text": "景色", "reading": "けしき", "pos": "名詞", "meaning": "景色"}, {"text": "を", "reading": "を", "pos": "助詞", "meaning": "賓格助詞，表示動作對象"}, {"text": "今", "reading": "いま", "pos": "名詞", "meaning": "現在"}, {"text": "も", "reading": "も", "pos": "助詞", "meaning": "也、依然"}], "grammar": "「〜と〜たい」想和〜一起做。「今も」表示「現在依然」。句尾省略。"}, {"id": 11, "start": 69.367, "end": 75.75, "japanese": "ずっとずっと見つめたまま", "chinese": "一直凝視著那片想與你一同欣賞的景色。", "words": [{"text": "ずっと", "reading": "ずっと", "pos": "副詞", "meaning": "一直、始終"}, {"text": "ずっと", "reading": "ずっと", "pos": "副詞", "meaning": "一直、始終"}, {"text": "見つめ", "reading": "みつめ", "pos": "動詞", "meaning": "凝視、注視"}, {"text": "た", "reading": "た", "pos": "助動詞", "meaning": "表過去、完了"}, {"text": "まま", "reading": "まま", "pos": "名詞", "meaning": "保持…狀態、原樣"}], "grammar": "「～たまま」表示保持動作或狀態不變，意為「保持著…的狀態」。"}, {"id": 12, "start": 77.138, "end": 82.819, "japanese": "降りしきる雪が積もるように", "chinese": "就像紛飛的雪花不斷堆積一樣，", "words": [{"text": "降りしきる", "reading": "ふりしきる", "pos": "動詞", "meaning": "不停地下（雪、雨）"}, {"text": "雪", "reading": "ゆき", "pos": "名詞", "meaning": "雪"}, {"text": "が", "reading": "が", "pos": "助詞", "meaning": "主格助詞"}, {"text": "積もる", "reading": "つもる", "pos": "動詞", "meaning": "堆積、積累"}, {"text": "よう", "reading": "よう", "pos": "名詞", "meaning": "樣子、方式"}, {"text": "に", "reading": "に", "pos": "助詞", "meaning": "表示目的、方式、比喻"}], "grammar": "「～ように」表示比喻或舉例，意為「如同…一般」。"}, {"id": 13, "start": 82.819, "end": 88.114, "japanese": "この町でただあなたを想う", "chinese": "在這個小鎮裡，我只是思念著你。", "words": [{"text": "この", "reading": "この", "pos": "連体詞", "meaning": "這個"}, {"text": "町", "reading": "まち", "pos": "名詞", "meaning": "城鎮"}, {"text": "で", "reading": "で", "pos": "助詞", "meaning": "表示地點、範圍"}, {"text": "ただ", "reading": "ただ", "pos": "副詞", "meaning": "僅僅、只是"}, {"text": "あなた", "reading": "あなた", "pos": "代名詞", "meaning": "你"}, {"text": "を", "reading": "を", "pos": "助詞", "meaning": "賓格助詞"}, {"text": "想う", "reading": "おもう", "pos": "動詞", "meaning": "思念、想念"}], "grammar": "「～で」表示動作發生的地點。「～を想う」表示「思念某人」。"}, {"id": 14, "start": 88.114, "end": 93.513, "japanese": "離れていても同じ空が", "chinese": "即使相隔兩地，", "words": [{"text": "離れて", "reading": "はなれて", "pos": "動詞", "meaning": "分離、離開"}, {"text": "いて", "reading": "いて", "pos": "動詞", "meaning": "表狀態持續"}, {"text": "も", "reading": "も", "pos": "助詞", "meaning": "即使、也"}, {"text": "同じ", "reading": "おなじ", "pos": "形容動詞", "meaning": "相同、一樣的"}, {"text": "空", "reading": "そら", "pos": "名詞", "meaning": "天空"}, {"text": "が", "reading": "が", "pos": "助詞", "meaning": "主格助詞"}], "grammar": "「～ていても」表示逆接條件，意為「即使…也」。"}, {"id": 15, "start": 93.513, "end": 97.206, "japanese": "どうか見えていますように", "chinese": "也願我們能看著同一片天空。", "words": [{"text": "どうか", "reading": "どうか", "pos": "副詞", "meaning": "請務必、無論如何"}, {"text": "見えて", "reading": "みえて", "pos": "動詞", "meaning": "能看見、看得見"}, {"text": "います", "reading": "います", "pos": "動詞", "meaning": "表狀態持續"}, {"text": "よう", "reading": "よう", "pos": "名詞", "meaning": "樣子、方式"}, {"text": "に", "reading": "に", "pos": "助詞", "meaning": "表示願望、目的"}], "grammar": "「～ように」在此表示願望或祈求，意為「希望能夠…」。"}, {"id": 16, "start": 107.129, "end": 112.031, "japanese": "「またね」と優しい声が響く", "chinese": "「再見」那溫柔的聲音迴盪著。", "words": [{"text": "「またね」", "reading": "またね", "pos": "感嘆詞", "meaning": "再見、回頭見"}, {"text": "と", "reading": "と", "pos": "助詞", "meaning": "引述助詞"}, {"text": "優しい", "reading": "やさしい", "pos": "形容詞", "meaning": "溫柔的、親切的"}, {"text": "声", "reading": "こえ", "pos": "名詞", "meaning": "聲音"}, {"text": "が", "reading": "が", "pos": "助詞", "meaning": "主格助詞"}, {"text": "響く", "reading": "ひびく", "pos": "動詞", "meaning": "響徹、迴盪"}], "grammar": "「～と」用於引述內容，意為「…地（說/響起）」。"}, {"id": 17, "start": 112.031, "end": 118.039, "japanese": "耳元にあなたが残した静寂", "chinese": "你在我耳邊留下的寂靜。", "words": [{"text": "耳元", "reading": "みみもと", "pos": "名詞", "meaning": "耳邊"}, {"text": "に", "reading": "に", "pos": "助詞", "meaning": "表示地點"}, {"text": "あなた", "reading": "あなた", "pos": "代名詞", "meaning": "你"}, {"text": "が", "reading": "が", "pos": "助詞", "meaning": "主格助詞"}, {"text": "残した", "reading": "のこした", "pos": "動詞", "meaning": "留下"}, {"text": "静寂", "reading": "せいじゃく", "pos": "名詞", "meaning": "寂靜、寧靜"}], "grammar": "「～が～た＋名詞」表示「某人留下的…」，「が」標示動作主體。"}, {"id": 18, "start": 118.039, "end": 122.771, "japanese": "世界が切り離された夜", "chinese": "世界被隔絕的夜晚。", "words": [{"text": "世界", "reading": "せかい", "pos": "名詞", "meaning": "世界"}, {"text": "が", "reading": "が", "pos": "助詞", "meaning": "主格助詞"}, {"text": "切り離さ", "reading": "きりはなさ", "pos": "動詞", "meaning": "切離、分離"}, {"text": "れ", "reading": "れ", "pos": "助動詞", "meaning": "表被動"}, {"text": "た", "reading": "た", "pos": "助動詞", "meaning": "表過去、完了"}, {"text": "夜", "reading": "よる", "pos": "名詞", "meaning": "夜晚"}], "grammar": "「～が～れる」表示被動語態，意為「世界被切離的夜晚」。"}, {"id": 19, "start": 122.771, "end": 126.349, "japanese": "また目を瞑る", "chinese": "我再次閉上雙眼。", "words": [{"text": "また", "reading": "また", "pos": "副詞", "meaning": "再、又"}, {"text": "目", "reading": "め", "pos": "名詞", "meaning": "眼睛"}, {"text": "を", "reading": "を", "pos": "助詞", "meaning": "賓格助詞"}, {"text": "瞑る", "reading": "つむる", "pos": "動詞", "meaning": "閉上（眼睛）"}], "grammar": "「～を瞑る」是慣用搭配，意為「閉上眼睛」。"}, {"id": 20, "start": 128.896, "end": 131.133, "japanese": "くだらないことにずっと", "chinese": "一直都為著那些瑣事。", "words": [{"text": "くだらない", "reading": "くだらない", "pos": "形容詞", "meaning": "無聊的、沒價值的"}, {"text": "こと", "reading": "こと", "pos": "名詞", "meaning": "事情"}, {"text": "に", "reading": "に", "pos": "助詞", "meaning": "表示對象、原因"}, {"text": "ずっと", "reading": "ずっと", "pos": "副詞", "meaning": "一直、始終"}], "grammar": "「～ことに」表示對象或原因，此處表示「對於無聊的事情」。"}, {"id": 21, "start": 131.133, "end": 133.769, "japanese": "幸せを感じてたきっと", "chinese": "那時一定很幸福吧。", "words": [{"text": "幸せ", "reading": "しあわせ", "pos": "名詞", "meaning": "幸福"}, {"text": "を", "reading": "を", "pos": "助詞", "meaning": "(賓格助詞)"}, {"text": "感じてた", "reading": "かんじてた", "pos": "動詞", "meaning": "正在感受/感覺到了（「感じていた」的口語縮約）"}, {"text": "きっと", "reading": "きっと", "pos": "副詞", "meaning": "一定、肯定"}], "grammar": "「〜ていた」的口語縮約「〜てた」表示過去狀態或進行。助詞「を」表示動詞的受詞。副詞「きっと」加強語氣，表示「一定」。"}, {"id": 22, "start": 133.901, "end": 136.375, "japanese": "特別じゃない日々をもっと", "chinese": "好想多過點這種平凡的日子。", "words": [{"text": "特別", "reading": "とくべつ", "pos": "形容動詞詞幹", "meaning": "特別"}, {"text": "じゃない", "reading": "じゃない", "pos": "助動詞", "meaning": "不是（「ではない」的口語）"}, {"text": "日々", "reading": "ひび", "pos": "名詞", "meaning": "每天、日子"}, {"text": "を", "reading": "を", "pos": "助詞", "meaning": "(賓格助詞)"}, {"text": "もっと", "reading": "もっと", "pos": "副詞", "meaning": "更、更多"}], "grammar": "「〜じゃない」是「〜ではない」的口語否定形式。助詞「を」表示後續省略動詞的受詞。副詞「もっと」表示程度「更」。"}, {"id": 23, "start": 136.375, "end": 139.334, "japanese": "二人でただ過ごしていたくて", "chinese": "只想兩人就這樣過下去。", "words": [{"text": "二人", "reading": "ふたり", "pos": "名詞", "meaning": "兩人"}, {"text": "で", "reading": "で", "pos": "助詞", "meaning": "(表示人數、狀態)"}, {"text": "ただ", "reading": "ただ", "pos": "副詞", "meaning": "只是、僅僅"}, {"text": "過ごしていたくて", "reading": "すごしていたくて", "pos": "動詞", "meaning": "想一直度過、想就這樣度過（因為...）"}], "grammar": "「〜で」表示兩人一起的狀態。動詞「て形」接「〜いたい」表示願望，再接「〜て」表示原因或連接後續語句。"}, {"id": 24, "start": 139.334, "end": 141.806, "japanese": "季節が何度変わろうと", "chinese": "不管季節變換幾次。", "words": [{"text": "季節", "reading": "きせつ", "pos": "名詞", "meaning": "季節"}, {"text": "が", "reading": "が", "pos": "助詞", "meaning": "(主格助詞)"}, {"text": "何度", "reading": "なんど", "pos": "名詞", "meaning": "幾次、多少次"}, {"text": "変わろうと", "reading": "かわろうと", "pos": "動詞", "meaning": "無論變化多少次（「変わる」的意志形＋と）"}], "grammar": "「動詞意志形＋と」構成讓步條件句，表示「無論...也、即使...也」。助詞「が」表示主語。"}, {"id": 25, "start": 141.806, "end": 145.423, "japanese": "隣にいたいよ　ねえそれ以上", "chinese": "我想待在你身邊，除了這些", "words": [{"text": "隣", "reading": "となり", "pos": "名詞", "meaning": "旁邊"}, {"text": "に", "reading": "に", "pos": "助詞", "meaning": "(表示位置)"}, {"text": "いたい", "reading": "いたい", "pos": "形容詞", "meaning": "想在、想待著"}, {"text": "よ", "reading": "よ", "pos": "助詞", "meaning": "(終助詞，強調)"}, {"text": "ねえ", "reading": "ねえ", "pos": "感嘆詞", "meaning": "嘿、喂"}, {"text": "それ", "reading": "それ", "pos": "代名詞", "meaning": "那個"}, {"text": "以上", "reading": "いじょう", "pos": "名詞", "meaning": "以上、更多"}], "grammar": "「〜にいる」表示在某處。「〜たい」表示願望。終助詞「よ」表示強調。句型「それ以上」表示「比那個更多」。"}, {"id": 26, "start": 145.423, "end": 149.139, "japanese": "何もいらないから", "chinese": "什麼都不想要了。", "words": [{"text": "何も", "reading": "なにも", "pos": "副詞", "meaning": "什麼也沒、什麼都不"}, {"text": "いらない", "reading": "いらない", "pos": "動詞", "meaning": "不需要"}, {"text": "から", "reading": "から", "pos": "助詞", "meaning": "(表示原因)"}], "grammar": "「疑問詞＋も＋否定」表示「全部否定」。動詞「要る」的否定形是「いらない」。助詞「から」表示原因。"}, {"id": 27, "start": 149.139, "end": 154.718, "japanese": "降りしきる雪が積もるように", "chinese": "就像紛飛的雪堆積起來一樣。", "words": [{"text": "降りしきる", "reading": "ふりしきる", "pos": "動詞", "meaning": "下個不停、持續不斷地下"}, {"text": "雪", "reading": "ゆき", "pos": "名詞", "meaning": "雪"}, {"text": "が", "reading": "が", "pos": "助詞", "meaning": "(主格助詞)"}, {"text": "積もる", "reading": "つもる", "pos": "動詞", "meaning": "堆積、積累"}, {"text": "ように", "reading": "ように", "pos": "助詞", "meaning": "像...一樣"}], "grammar": "「動詞連用形＋しきる」表示動作持續不斷。句型「動詞基本形＋ように」表示比喻「像...一樣」。"}, {"id": 28, "start": 154.718, "end": 160.038, "japanese": "遠い町でただあなたを想う", "chinese": "在遙遠的城市裡，我只是思念著你。", "words": [{"text": "遠い", "reading": "とおい", "pos": "形容詞", "meaning": "遙遠的"}, {"text": "町", "reading": "まち", "pos": "名詞", "meaning": "城鎮、街道"}, {"text": "で", "reading": "で", "pos": "助詞", "meaning": "(表示場所)"}, {"text": "ただ", "reading": "ただ", "pos": "副詞", "meaning": "只是、僅僅"}, {"text": "あなた", "reading": "あなた", "pos": "代名詞", "meaning": "你"}, {"text": "を", "reading": "を", "pos": "助詞", "meaning": "(賓格助詞)"}, {"text": "想う", "reading": "おもう", "pos": "動詞", "meaning": "思念、想念"}], "grammar": "形容詞「遠い」修飾名詞「町」。助詞「で」表示動作發生的地點。助詞「を」表示動詞的受詞。副詞「ただ」表示「僅僅」。"}, {"id": 29, "start": 160.038, "end": 165.425, "japanese": "触れ合うことができなくても", "chinese": "即使無法觸碰到彼此。", "words": [{"text": "触れ合う", "reading": "ふれあう", "pos": "動詞", "meaning": "互相接觸"}, {"text": "こと", "reading": "こと", "pos": "名詞", "meaning": "事情、這件事"}, {"text": "が", "reading": "が", "pos": "助詞", "meaning": "(主格助詞)"}, {"text": "できなくても", "reading": "できなくても", "pos": "動詞", "meaning": "即使無法做到"}], "grammar": "「動詞基本形＋こと」將動詞名詞化。助詞「が」指出主語。「〜なくても」是「〜ない＋ても」的縮約，表示讓步條件「即使不...也」。"}, {"id": 30, "start": 165.425, "end": 168.239, "japanese": "変わることなく", "chinese": "不曾改變。", "words": [{"text": "変わる", "reading": "かわる", "pos": "動詞", "meaning": "改變"}, {"text": "こと", "reading": "こと", "pos": "名詞", "meaning": "事情、這件事"}, {"text": "なく", "reading": "なく", "pos": "助動詞", "meaning": "沒有...地、不...地"}], "grammar": "「動詞基本形＋ことなく」是固定句型，表示「沒有...地、不曾...地」，強調動作持續不變。"}, {"id": 31, "start": 168.813, "end": 170.343, "japanese": "何度だってそう", "chinese": "無論多少次都一樣。", "words": [{"text": "何度", "reading": "なんど", "pos": "名詞", "meaning": "幾次"}, {"text": "だって", "reading": "だって", "pos": "助詞", "meaning": "即使是、連...也"}, {"text": "そう", "reading": "そう", "pos": "副詞", "meaning": "那樣"}], "grammar": "「だって」表示強調「連...也」「即使是...也」。"}, {"id": 32, "start": 170.343, "end": 173.157, "japanese": "振り返ればあの日の", "chinese": "只要回想起那天的", "words": [{"text": "振り返れば", "reading": "ふりかえれば", "pos": "動詞", "meaning": "如果回首"}, {"text": "あの", "reading": "あの", "pos": "連体詞", "meaning": "那個"}, {"text": "日", "reading": "ひ", "pos": "名詞", "meaning": "天、日子"}, {"text": "の", "reading": "の", "pos": "助詞", "meaning": "的"}], "grammar": "動詞假定形「～ば」表示條件「如果...」。助詞「の」連接名詞修飾。"}, {"id": 33, "start": 173.157, "end": 177.484, "japanese": "あなたの言葉が声が", "chinese": "你的話語、你的聲音", "words": [{"text": "あなた", "reading": "あなた", "pos": "代名詞", "meaning": "你"}, {"text": "の", "reading": "の", "pos": "助詞", "meaning": "的"}, {"text": "言葉", "reading": "ことば", "pos": "名詞", "meaning": "話語、詞彙"}, {"text": "が", "reading": "が", "pos": "助詞", "meaning": "（表示主語）"}, {"text": "声", "reading": "こえ", "pos": "名詞", "meaning": "聲音"}, {"text": "が", "reading": "が", "pos": "助詞", "meaning": "（表示主語）"}], "grammar": "「の」表示所有格。「が」表示主語，句中連用兩個主語表示並列。"}, {"id": 34, "start": 177.484, "end": 179.497, "japanese": "会いたくなるんだよ", "chinese": "我就會好想你喔。", "words": [{"text": "会い", "reading": "あい", "pos": "動詞", "meaning": "見面"}, {"text": "たく", "reading": "たく", "pos": "助動詞", "meaning": "想..."}, {"text": "なる", "reading": "なる", "pos": "動詞", "meaning": "變得"}, {"text": "ん", "reading": "ん", "pos": "助動詞", "meaning": "的（口語縮略）"}, {"text": "だ", "reading": "だ", "pos": "助動詞", "meaning": "是"}, {"text": "よ", "reading": "よ", "pos": "助詞", "meaning": "喔"}], "grammar": "「～たくなる」表示「變得想做某事」。口語助動詞「んだ」表強調，「よ」表告知。"}, {"id": 35, "start": 179.497, "end": 181.014, "japanese": "何度だってそう", "chinese": "無論多少次都一樣。", "words": [{"text": "何度", "reading": "なんど", "pos": "名詞", "meaning": "幾次"}, {"text": "だって", "reading": "だって", "pos": "助詞", "meaning": "即使是、連...也"}, {"text": "そう", "reading": "そう", "pos": "副詞", "meaning": "那樣"}], "grammar": "「だって」表示強調「連...也」「即使是...也」。"}, {"id": 36, "start": 181.014, "end": 184.133, "japanese": "信じ合えればいつまでも", "chinese": "只要能互相信任，就能永遠。", "words": [{"text": "信じ", "reading": "しんじ", "pos": "動詞", "meaning": "相信"}, {"text": "合え", "reading": "あえ", "pos": "動詞", "meaning": "互相..."}, {"text": "れば", "reading": "れば", "pos": "助詞", "meaning": "如果"}, {"text": "いつまで", "reading": "いつまで", "pos": "副詞", "meaning": "直到何時"}, {"text": "も", "reading": "も", "pos": "助詞", "meaning": "也"}], "grammar": "動詞可能形「～(ら)れる」後接假定形「～ば」，表示「如果能...」。"}, {"id": 37, "start": 184.133, "end": 190.829, "japanese": "二人繋がっていられる", "chinese": "兩人就能一直緊密相連。", "words": [{"text": "二人", "reading": "ふたり", "pos": "名詞", "meaning": "兩人"}, {"text": "繋がって", "reading": "つながって", "pos": "動詞", "meaning": "連結著"}, {"text": "いられる", "reading": "いられる", "pos": "動詞", "meaning": "能存在、能維持"}], "grammar": "動詞「～て いる」表示動作持續或狀態。「～て いられる」是其可能形。"}, {"id": 38, "start": 191.923, "end": 197.473, "japanese": "雪明かり照らすこの町にも", "chinese": "被雪光照耀的這座城市，也", "words": [{"text": "雪明かり", "reading": "ゆきあかり", "pos": "名詞", "meaning": "雪光"}, {"text": "照らす", "reading": "てらす", "pos": "動詞", "meaning": "照亮"}, {"text": "この", "reading": "この", "pos": "連体詞", "meaning": "這個"}, {"text": "町", "reading": "まち", "pos": "名詞", "meaning": "小鎮、街道"}, {"text": "に", "reading": "に", "pos": "助詞", "meaning": "在"}, {"text": "も", "reading": "も", "pos": "助詞", "meaning": "也"}], "grammar": "動詞「照らす」修飾名詞「この町」。助詞「に」表示地點，「も」表示「甚至連...也」。"}, {"id": 39, "start": 197.473, "end": 202.801, "japanese": "いつかは優しい春が芽吹く", "chinese": "總有一天溫暖的春天會萌芽。", "words": [{"text": "いつか", "reading": "いつか", "pos": "副詞", "meaning": "總有一天"}, {"text": "は", "reading": "は", "pos": "助詞", "meaning": "（表示主題或強調）"}, {"text": "優しい", "reading": "やさしい", "pos": "形容詞", "meaning": "溫柔的、舒適的"}, {"text": "春", "reading": "はる", "pos": "名詞", "meaning": "春天"}, {"text": "が", "reading": "が", "pos": "助詞", "meaning": "（表示主語）"}, {"text": "芽吹く", "reading": "めぶく", "pos": "動詞", "meaning": "發芽"}], "grammar": "「いつか」表示「總有一天」。形容詞「優しい」修飾名詞「春」。助詞「が」表示主語。"}, {"id": 40, "start": 202.801, "end": 208.131, "japanese": "ここでまた会えたその時は", "chinese": "當我們能在這裡再次相遇的時候。", "words": [{"text": "ここ", "reading": "ここ", "pos": "名詞", "meaning": "這裡"}, {"text": "で", "reading": "で", "pos": "助詞", "meaning": "在"}, {"text": "また", "reading": "また", "pos": "副詞", "meaning": "再度"}, {"text": "会え", "reading": "あえ", "pos": "動詞", "meaning": "見面"}, {"text": "た", "reading": "た", "pos": "助動詞", "meaning": "了"}, {"text": "その", "reading": "その", "pos": "連体詞", "meaning": "那個"}, {"text": "時", "reading": "とき", "pos": "名詞", "meaning": "時候、時間"}, {"text": "は", "reading": "は", "pos": "助詞", "meaning": "（表示主題或強調）"}], "grammar": "「～で」表示動作地點。動詞可能形過去式「会えた」，後接「時」形成時間條件。"}, {"id": 41, "start": 208.131, "end": 213.0, "japanese": "涙溢さないように", "chinese": "忍住眼淚。", "words": [{"text": "涙", "reading": "なみだ", "pos": "名詞", "meaning": "眼淚"}, {"text": "溢さ", "reading": "こぼさ", "pos": "動詞", "meaning": "溢出"}, {"text": "ない", "reading": "ない", "pos": "助動詞", "meaning": "不、沒有"}, {"text": "ように", "reading": "ように", "pos": "助詞", "meaning": "為了不、以便不"}], "grammar": "Vないように: 表示「為了不...」或「以免...」。"}, {"id": 42, "start": 213.199, "end": 218.812, "japanese": "冬の終わりを告げる淡雪", "chinese": "預告冬盡的淡雪。", "words": [{"text": "冬", "reading": "ふゆ", "pos": "名詞", "meaning": "冬天"}, {"text": "の", "reading": "の", "pos": "助詞", "meaning": "的"}, {"text": "終わり", "reading": "おわり", "pos": "名詞", "meaning": "結束"}, {"text": "を", "reading": "を", "pos": "助詞", "meaning": "表示受詞"}, {"text": "告げる", "reading": "つげる", "pos": "動詞", "meaning": "宣告"}, {"text": "淡雪", "reading": "あわゆき", "pos": "名詞", "meaning": "淡雪、初雪"}], "grammar": "NのN: 名詞修飾名詞。VるN: 動詞原形修飾名詞。"}, {"id": 43, "start": 218.812, "end": 224.116, "japanese": "そのひとときに願いを乗せる", "chinese": "把心願寄託在那片刻。", "words": [{"text": "その", "reading": "その", "pos": "連体詞", "meaning": "那個"}, {"text": "ひととき", "reading": "ひととき", "pos": "名詞", "meaning": "片刻、一時"}, {"text": "に", "reading": "に", "pos": "助詞", "meaning": "在...上"}, {"text": "願い", "reading": "ねがい", "pos": "名詞", "meaning": "願望"}, {"text": "を", "reading": "を", "pos": "助詞", "meaning": "表示受詞"}, {"text": "乗せる", "reading": "のせる", "pos": "動詞", "meaning": "承載"}], "grammar": "NにNをV: 表示將N2寄託於N1上。"}, {"id": 44, "start": 224.116, "end": 229.423, "japanese": "どんな季節も景色もあなたと", "chinese": "無論什麼季節、什麼景色，都想和你一起。", "words": [{"text": "どんな", "reading": "どんな", "pos": "連体詞", "meaning": "無論何種的"}, {"text": "季節", "reading": "きせつ", "pos": "名詞", "meaning": "季節"}, {"text": "も", "reading": "も", "pos": "助詞", "meaning": "也、都"}, {"text": "景色", "reading": "けしき", "pos": "名詞", "meaning": "景色"}, {"text": "も", "reading": "も", "pos": "助詞", "meaning": "也、都"}, {"text": "あなた", "reading": "あなた", "pos": "代名詞", "meaning": "你"}, {"text": "と", "reading": "と", "pos": "助詞", "meaning": "和、與"}], "grammar": "NもNも: 表「N1和N2都...」。Nと: 表「和N一起」。"}, {"id": 45, "start": 229.423, "end": 234.501, "japanese": "共に同じ場所で感じていたい", "chinese": "想在同一個地方一同感受。", "words": [{"text": "共に", "reading": "ともに", "pos": "副詞", "meaning": "一起"}, {"text": "同じ", "reading": "おなじ", "pos": "形容動詞", "meaning": "相同的"}, {"text": "場所", "reading": "ばしょ", "pos": "名詞", "meaning": "地方"}, {"text": "で", "reading": "で", "pos": "助詞", "meaning": "在、於"}, {"text": "感じて", "reading": "かんじて", "pos": "動詞", "meaning": "感受"}, {"text": "いたい", "reading": "いたい", "pos": "助動詞", "meaning": "想持續"}], "grammar": "Vていたい: 表示「想持續做某事」或「想保持某狀態」。"}, {"id": 46, "start": 234.501, "end": 240.143, "japanese": "町に柔らかな風が吹いて", "chinese": "小鎮上吹拂著柔和的風。", "words": [{"text": "町", "reading": "まち", "pos": "名詞", "meaning": "城鎮"}, {"text": "に", "reading": "に", "pos": "助詞", "meaning": "在"}, {"text": "柔らかな", "reading": "やわらかな", "pos": "形容動詞", "meaning": "溫柔的、柔軟的"}, {"text": "風", "reading": "かぜ", "pos": "名詞", "meaning": "風"}, {"text": "が", "reading": "が", "pos": "助詞", "meaning": "表示主語"}, {"text": "吹いて", "reading": "ふいて", "pos": "動詞", "meaning": "吹"}], "grammar": "NにV: 表示動作發生的場所。AなN: 形容動詞修飾名詞。"}, {"id": 47, "start": 240.143, "end": 245.491, "japanese": "鮮やかな花が咲くその日を", "chinese": "鮮豔花朵盛開的那天。", "words": [{"text": "鮮やかな", "reading": "あざやかな", "pos": "形容動詞", "meaning": "鮮豔的"}, {"text": "花", "reading": "はな", "pos": "名詞", "meaning": "花"}, {"text": "が", "reading": "が", "pos": "助詞", "meaning": "表示主語"}, {"text": "咲く", "reading": "さく", "pos": "動詞", "meaning": "綻放"}, {"text": "その", "reading": "その", "pos": "連体詞", "meaning": "那個"}, {"text": "日", "reading": "ひ", "pos": "名詞", "meaning": "日子"}, {"text": "を", "reading": "を", "pos": "助詞", "meaning": "表示受詞"}], "g const video = document.getElementById('video');
let currentIdx = -1;
let repeatMode = false;
let pausedForRepeat = false;
let currentWordData = null;
let vocabKey = 'vocab_' + location.href;

// ---- Vocab storage ----
function loadVocab() {
  try { return JSON.parse(localStorage.getItem(vocabKey) || '[]'); }
  catch { return []; }
}
function saveVocab(list) {
  localStorage.setItem(vocabKey, JSON.stringify(list));
  document.getElementById('vocab-count').textContent = list.length;
}
function initVocabCount() {
  document.getElementById('vocab-count').textContent = loadVocab().length;
}

// ---- Subtitle sync ----
function findSubtitleIdx(t) {
  let lo = 0, hi = SUBTITLES.length - 1;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    const s = SUBTITLES[mid];
    if (t < s.start) hi = mid - 1;
    else if (t > s.end) lo = mid + 1;
    else return mid;
  }
  return -1;
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderSubtitle(idx) {
  const jpEl = document.getElementById('jp-subtitle');
  const zhEl = document.getElementById('zh-subtitle');
  const overlay = document.getElementById('subtitle-overlay');
  if (idx < 0) {
    jpEl.innerHTML = '';
    zhEl.textContent = '';
    overlay.classList.remove('has-content');
    return;
  }
  const sub = SUBTITLES[idx];
  overlay.classList.add('has-content');
  zhEl.textContent = sub.chinese || '';
  if (sub.words && sub.words.length > 0) {
    jpEl.innerHTML = sub.words.map(w =>
      `<span class="word" data-text="${esc(w.text)}" data-reading="${esc(w.reading||w.text)}" data-pos="${esc(w.pos||'')}" data-meaning="${esc(w.meaning||'')}">${esc(w.text)}</span>`
    ).join('');
  } else {
    jpEl.innerHTML = `<span class="sentence-text">${esc(sub.japanese)}</span>`;
  }
}

video.addEventListener('timeupdate', () => {
  const t = video.currentTime;
  const idx = findSubtitleIdx(t);
  if (idx !== currentIdx) {
    currentIdx = idx;
    renderSubtitle(idx);
    // Auto-show grammar panel if open
    if (!document.getElementById('grammar-panel').style.display.includes('none')) {
      renderGrammar(idx);
    }
  }
  // Repeat mode: pause at subtitle end
  if (repeatMode && idx >= 0 && !pausedForRepeat) {
    const sub = SUBTITLES[idx];
    if (t >= sub.end - 0.08) {
      video.pause();
      pausedForRepeat = true;
    }
  }
  // Progress bar
  if (video.duration) {
    document.getElementById('progress-fill').style.width = (t / video.duration * 100) + '%';
  }
  document.getElementById('time-display').textContent = fmtTime(t) + ' / ' + fmtTime(video.duration || 0);
});

video.addEventListener('play', () => {
  document.getElementById('play-btn').textContent = '⏸';
});
video.addEventListener('pause', () => {
  document.getElementById('play-btn').textContent = '▶';
});

// ---- Controls ----
function togglePlay() {
  if (video.paused) video.play(); else video.pause();
}

document.getElementById('progress-wrap').addEventListener('click', e => {
  const rect = e.currentTarget.getBoundingClientRect();
  const ratio = (e.clientX - rect.left) / rect.width;
  if (video.duration) video.currentTime = ratio * video.duration;
});

function fmtTime(s) {
  if (!s || isNaN(s)) return '0:00';
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return m + ':' + String(sec).padStart(2, '0');
}

// ---- Repeat mode ----
function toggleRepeat() {
  repeatMode = !repeatMode;
  pausedForRepeat = false;
  document.getElementById('repeat-btn').classList.toggle('active', repeatMode);
  document.getElementById('repeat-hint').style.display = repeatMode ? 'block' : 'none';
}

function jumpToPrevSub() {
  let target;
  if (currentIdx > 0) {
    target = currentIdx - 1;
  } else if (currentIdx === 0) {
    target = 0;
  } else {
    // between subtitles: find last sub that started before now
    const now = video.currentTime;
    target = -1;
    for (let i = SUBTITLES.length - 1; i >= 0; i--) {
      if (SUBTITLES[i].start < now) { target = i; break; }
    }
  }
  if (target >= 0) video.currentTime = SUBTITLES[target].start + 0.01;
}

function jumpToNextSub() {
  let target;
  if (currentIdx >= 0) {
    target = currentIdx + 1;
  } else {
    // between subtitles: find first sub that starts after now
    const now = video.currentTime;
    target = -1;
    for (let i = 0; i < SUBTITLES.length; i++) {
      if (SUBTITLES[i].start > now) { target = i; break; }
    }
  }
  if (target >= 0 && target < SUBTITLES.length) video.currentTime = SUBTITLES[target].start + 0.01;
}

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
  if (repeatMode) {
    if (e.code === 'Space') {
      e.preventDefault();
      if (currentIdx >= 0) {
        video.currentTime = SUBTITLES[currentIdx].start + 0.01;
        video.play();
        pausedForRepeat = false;
      }
    } else if (e.code === 'ArrowRight' || e.code === 'Enter') {
      e.preventDefault();
      pausedForRepeat = false;
      video.play();
    } else if (e.code === 'ArrowLeft') {
      e.preventDefault();
      jumpToPrevSub();
    }
  } else {
    if (e.code === 'Space') {
      e.preventDefault();
      togglePlay();
    } else if (e.code === 'ArrowLeft') {
      e.preventDefault();
      jumpToPrevSub();
    } else if (e.code === 'ArrowRight') {
      e.preventDefault();
      jumpToNextSub();
    }
  }
});

// ---- Word popup ----
document.getElementById('jp-subtitle').addEventListener('click', e => {
  const word = e.target.closest('.word');
  if (word) {
    e.stopPropagation();
    showWordPopup(word, e);
  } else if (e.target.closest('.subtitle-overlay')) {
    // Clicked sentence area -> show grammar
    showGrammarPanel();
  }
});

function showWordPopup(el, e) {
  currentWordData = {
    text: el.dataset.text,
    reading: el.dataset.reading,
    pos: el.dataset.pos,
    meaning: el.dataset.meaning,
    sentence: currentIdx >= 0 ? SUBTITLES[currentIdx].japanese : ''
  };
  document.getElementById('pu-word').textContent = currentWordData.text;
  document.getElementById('pu-reading').textContent = currentWordData.reading !== currentWordData.text ? currentWordData.reading : '';
  document.getElementById('pu-pos').textContent = currentWordData.pos;
  document.getElementById('pu-meaning').textContent = currentWordData.meaning;

  const saveBtn = document.getElementById('pu-save');
  const vocab = loadVocab();
  const already = vocab.some(v => v.text === currentWordData.text);
  saveBtn.textContent = already ? '已加入生詞本' : '加入生詞本';
  saveBtn.className = 'popup-save' + (already ? ' popup-saved' : '');
  saveBtn.onclick = already ? null : addCurrentToVocab;

  const popup = document.getElementById('word-popup');
  popup.style.display = 'block';
  // Position: above the word
  const rect = el.getBoundingClientRect();
  const pw = popup.offsetWidth || 220;
  const ph = popup.offsetHeight || 120;
  let x = rect.left + rect.width / 2 - pw / 2;
  let y = rect.top - ph - 8;
  if (y < 8) y = rect.bottom + 8;
  if (x < 8) x = 8;
  if (x + pw > window.innerWidth - 8) x = window.innerWidth - pw - 8;
  popup.style.left = x + 'px';
  popup.style.top = y + 'px';
}

function hidePopup() {
  document.getElementById('word-popup').style.display = 'none';
  currentWordData = null;
}

document.addEventListener('click', e => {
  if (!e.target.closest('#word-popup') && !e.target.closest('.word')) hidePopup();
});

function addCurrentToVocab() {
  if (!currentWordData) return;
  const vocab = loadVocab();
  if (!vocab.some(v => v.text === currentWordData.text)) {
    vocab.unshift({ ...currentWordData, addedAt: new Date().toISOString() });
    saveVocab(vocab);
    const saveBtn = document.getElementById('pu-save');
    saveBtn.textContent = '已加入生詞本';
    saveBtn.className = 'popup-save popup-saved';
    saveBtn.onclick = null;
    if (!document.getElementById('vocab-panel').style.display.includes('none')) renderVocab();
  }
}

// ---- Grammar Panel ----
function toggleGrammar() {
  const panel = document.getElementById('grammar-panel');
  const isHidden = panel.style.display === 'none';
  panel.style.display = isHidden ? 'flex' : 'none';
  document.getElementById('grammar-btn').classList.toggle('active', isHidden);
  if (isHidden) renderGrammar(currentIdx);
}

function showGrammarPanel() {
  const panel = document.getElementById('grammar-panel');
  panel.style.display = 'flex';
  document.getElementById('grammar-btn').classList.add('active');
  renderGrammar(currentIdx);
}

function renderGrammar(idx) {
  const el = document.getElementById('grammar-content');
  if (idx < 0 || idx >= SUBTITLES.length) {
    el.innerHTML = '<div style="color:#555;font-size:14px;text-align:center;margin-top:40px">點擊字幕顯示文法解析</div>';
    return;
  }
  const sub = SUBTITLES[idx];
  let html = `<div class="grammar-sentence">${esc(sub.japanese)}<br><span style="font-size:13px;color:#888">${esc(sub.chinese)}</span></div>`;
  html += `<div class="grammar-text">${esc(sub.grammar || '（無文法資料）')}</div>`;

  if (sub.words && sub.words.length > 0) {
    html += `<div class="grammar-words"><h4>分詞列表</h4>`;
    sub.words.forEach(w => {
      html += `<div class="word-row" onclick="showWordInPopupFromGrammar(this)" data-text="${esc(w.text)}" data-reading="${esc(w.reading||w.text)}" data-pos="${esc(w.pos||'')}" data-meaning="${esc(w.meaning||'')}">
        <span class="wr-text">${esc(w.text)}</span>
        <span class="wr-reading">${esc(w.reading||'')}</span>
        <span class="wr-pos">${esc(w.pos||'')}</span>
        <span class="wr-meaning">${esc(w.meaning||'')}</span>
        <span class="wr-add" title="加入生詞本">＋</span>
      </div>`;
    });
    html += `</div>`;
  }
  el.innerHTML = html;
}

function showWordInPopupFromGrammar(row) {
  // Add to vocab directly from grammar panel
  const data = {
    text: row.dataset.text, reading: row.dataset.reading,
    pos: row.dataset.pos, meaning: row.dataset.meaning,
    sentence: currentIdx >= 0 ? SUBTITLES[currentIdx].japanese : ''
  };
  currentWordData = data;
  const vocab = loadVocab();
  if (!vocab.some(v => v.text === data.text)) {
    vocab.unshift({ ...data, addedAt: new Date().toISOString() });
    saveVocab(vocab);
    const addBtn = row.querySelector('.wr-add');
    if (addBtn) { addBtn.textContent = '✓'; addBtn.style.color = '#6adf9a'; }
    if (!document.getElementById('vocab-panel').style.display.includes('none')) renderVocab();
  }
}

// ---- Vocab Panel ----
function toggleVocab() {
  const panel = document.getElementById('vocab-panel');
  const isHidden = panel.style.display === 'none';
  panel.style.display = isHidden ? 'flex' : 'none';
  document.getElementById('vocab-btn').classList.toggle('active', isHidden);
  if (isHidden) renderVocab();
}

function renderVocab() {
  const vocab = loadVocab();
  const el = document.getElementById('vocab-content');
  if (vocab.length === 0) {
    el.innerHTML = '<div class="vocab-empty">生詞本是空的<br><br>點擊字幕中的單字<br>按「加入生詞本」儲存</div>';
    return;
  }
  let html = `<button class="copy-btn" onclick="copyVocab()">複製全部（純文字）</button>`;
  vocab.forEach((v, i) => {
    html += `<div class="vocab-item">
      <div class="vocab-item-header">
        <div>
          <span class="vocab-word">${esc(v.text)}</span>
          <span class="vocab-reading" style="margin-left:8px">${esc(v.reading||'')}</span>
          <span class="vocab-pos" style="margin-left:6px">${esc(v.pos||'')}</span>
        </div>
        <button class="vocab-del" onclick="deleteVocab(${i})" title="刪除">×</button>
      </div>
      <div class="vocab-meaning">${esc(v.meaning||'')}</div>
      ${v.sentence ? `<div class="vocab-sentence">${esc(v.sentence)}</div>` : ''}
    </div>`;
  });
  el.innerHTML = html;
}

function deleteVocab(idx) {
  const vocab = loadVocab();
  vocab.splice(idx, 1);
  saveVocab(vocab);
  renderVocab();
}

function copyVocab() {
  const vocab = loadVocab();
  const text = vocab.map(v => `${v.text}\t${v.reading||''}\t${v.pos||''}\t${v.meaning||''}\t${v.sentence||''}`).join('\n');
  navigator.clipboard.writeText(text).then(() => alert('已複製 ' + vocab.length + ' 個生詞'));
}

initVocabCount();
</script>
</body>
