        const VocabularySlides = () => {
            const [currentIndex, setCurrentIndex] = useState(0);
            const [isFlipped, setIsFlipped] = useState(false);

            // 語音合成功能：自動過濾括號與標註，只讀日文
            const speak = (text) => {
                if (!text) return;
                // 移除 [kana] 和 (中文) 和 （中文）
                let cleanText = text.replace(/\[.*?\]/g, "").replace(/\(.*?\)/g, "").replace(/（.*?）/g, "");
                // 移除 "関連語：" 這類的標籤
                cleanText = cleanText.replace(/関連語：/g, "").replace(/対義語：/g, "");
                
                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = 'ja-JP';
                utterance.rate = 0.9; // 稍微放慢語速
                window.speechSynthesis.cancel(); // 停止上一句
                window.speechSynthesis.speak(utterance);
            };

            // Furigana 組件：解析 "漢字[かな]" 格式
            const FuriganaText = ({ text, className = "", showSpeaker = false, speakerColor = "text-gray-400" }) => {
                if (!text) return null;
                const lines = text.split('\n');
                return (
                    <>
                        {lines.map((line, lineIndex) => {
                            // 分離日文部分與中文翻譯 (假設用括號分隔)
                            const parts = line.split(/(\(.*?\)|（.*?）)/);
                            
                            return (
                                <div key={lineIndex} className={`flex items-start gap-2 ${lineIndex > 0 ? 'mt-3 pt-2 border-t border-dashed border-gray-200' : ''} ${className}`}>
                                    {showSpeaker && (
                                        <button 
                                            onClick={(e) => { e.stopPropagation(); speak(line); }} 
                                            className={`mt-1 flex-shrink-0 p-1.5 rounded-full hover:bg-gray-100 transition-colors ${speakerColor}`} 
                                            title="朗讀此句"
                                        >
                                            <Volume2 size={16} />
                                        </button>
                                    )}
                                    <span className="block flex-1 leading-relaxed text-lg">
                                        {parts.map((part, pIndex) => {
                                            if (part.startsWith('(') || part.startsWith('（')) {
                                                // 這是中文翻譯，顯示為灰色較小字體
                                                return <span key={pIndex} className="text-gray-500 text-base ml-1 block sm:inline">{part}</span>;
                                            }
                                            
                                            // 解析日文部分的 Furigana
                                            const regex = /([\u4e00-\u9faf々]+)\[(.*?)\]/g;
                                            const subParts = [];
                                            let lastIndex = 0;
                                            let match;
                                            while ((match = regex.exec(part)) !== null) {
                                                if (match.index > lastIndex) subParts.push(<span key={`${lineIndex}-${pIndex}-${lastIndex}`}>{part.substring(lastIndex, match.index)}</span>);
                                                subParts.push(
                                                    <ruby key={`${lineIndex}-${pIndex}-${match.index}`} className="mx-0.5">
                                                        {match[1]}<rt>{match[2]}</rt>
                                                    </ruby>
                                                );
                                                lastIndex = regex.lastIndex;
                                            }
                                            if (lastIndex < part.length) subParts.push(<span key={`${lineIndex}-${pIndex}-end`}>{part.substring(lastIndex)}</span>);
                                            
                                            return <span key={pIndex}>{subParts}</span>;
                                        })}
                                    </span>
                                </div>
                            );
                        })}

                {
                    id: 47, kanji: "無理[むり]", reading: "むり", meaning: "勉強 / 不講理 / 不可能",
                    example: "怒[おこ]るのも無理[むり]はない (會生氣也是情有可原/難怪會生氣)\n無理[むり]な注文[ちゅうもん]を出[だ]す (提出無理的要求)\n無理[むり]が祟[たた]って体[からだ]を壊[こわ]す (因為過度勉強而搞壞身體)\n無理[むり]が通[とお]れば道理[どうり]が引[ひ]っ込[こ]む (蠻橫不講理若行得通，道理就行不通了)\n女[おんな]と無理心中[むりしんじゅう]する (強迫女子一同殉情)",
                    color: "bg-rose-50", accentColor: "text-rose-600", borderColor: "border-rose-200"
                },
                // --- 48. 12星座 (截圖補充) ---
                {
                    id: 48, kanji: "１２星座[せいざ]", reading: "じゅうにせいざ", meaning: "12星座",
                    example: "おひつじ座[ざ] (牡羊)／おうし座[ざ] (牡牛)／ふたご座[ざ] (雙子)\nかに座[ざ] (巨蟹)／しし座[ざ] (獅子)／おとめ座[ざ] (處女)\nてんびん座[ざ] (天秤)／さそり座[ざ] (天蠍)／いて座[ざ] (射手)\nやぎ座[ざ] (山羊)／みずがめ座[ざ] (水瓶)／うお座[ざ] (雙魚)",
                    color: "bg-purple-50", accentColor: "text-purple-600", borderColor: "border-purple-200"
                },
                // --- 49. 遅く (截圖補充) ---
                {
                    id: 49, kanji: "遅[おそ]く", reading: "おそく", meaning: "晚 / 遲",
                    example: "近[ちか]く (附近/快要)\n遠[とお]く (遠處)\n古[ふる]く (很久以前)",
                    color: "bg-gray-50", accentColor: "text-gray-600", borderColor: "border-gray-200"
                }
            ];

            const currentWord = vocabularyList[currentIndex];
            const getImageUrl = (id) => `images/vocab_${id}.jpg`;

            const handleNext = useCallback(() => { setIsFlipped(false); setCurrentIndex((prev) => (prev + 1) % vocabularyList.length); }, [vocabularyList.length]);
            const handlePrev = useCallback(() => { setIsFlipped(false); setCurrentIndex((prev) => (prev - 1 + vocabularyList.length) % vocabularyList.length); }, [vocabularyList.length]);
            const handleFlip = () => setIsFlipped(!isFlipped);

            // 鍵盤控制
            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === 'ArrowRight') handleNext();
                    if (e.key === 'ArrowLeft') handlePrev();
                    if (e.key === ' ' || e.key === 'Enter') handleFlip();
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [handleNext, handlePrev]);

            return (
                <div className="flex flex-col items-center justify-center min-h-screen bg-slate-100 p-4 font-sans select-none">
                    <div className="mb-6 text-center">
                        <h1 className="text-3xl font-bold text-slate-800 mb-1 flex items-center justify-center gap-2">
                            <Star className="text-yellow-400 fill-yellow-400" />
                            大家的日本語 第32課
                            <Star className="text-yellow-400 fill-yellow-400" />
                        </h1>
                        <p className="text-slate-500 text-sm font-medium">全方位互動單字卡 (含截圖補充與詳細例句)</p>
                    </div>

                    <div className="relative w-full max-w-md h-[600px] perspective-1000">
                        {/* 進度條 */}
                        <div className="absolute -top-6 left-0 w-full h-1.5 bg-gray-200 rounded-full overflow-hidden">
                            <div className="h-full bg-blue-500 transition-all duration-300 ease-out" style={{ width: `${((currentIndex + 1) / vocabularyList.length) * 100}%` }} />
                        </div>
                        <div className="absolute -top-8 right-0 text-xs font-bold text-slate-400 font-mono">
                            {currentIndex + 1} <span className="text-slate-300">/</span> {vocabularyList.length}
                        </div>

                        {/* 卡片主體 */}
                        <div className={`relative w-full h-full transition-transform duration-500 transform-style-3d cursor-pointer ${isFlipped ? 'rotate-y-180' : ''}`} onClick={handleFlip}>
                            
                            {/* 正面 (Front) */}
                            <div className={`absolute w-full h-full backface-hidden rounded-3xl card-shadow overflow-hidden border-2 ${currentWord.borderColor} flex flex-col ${currentWord.color} bg-white`}>
                                <div className="h-[45%] w-full bg-gray-200 relative overflow-hidden group">
                                    <img 
                                        src={getImageUrl(currentWord.id)} 
                                        alt={currentWord.kanji} 
                                        className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110" 
                                        onError={(e) => { e.target.onerror = null; e.target.src = `https://placehold.co/600x400/f1f5f9/94a3b8?text=${encodeURIComponent(currentWord.kanji)}`; }} 
                                    />
                                    <div className="absolute bottom-0 left-0 w-full h-1/3 bg-gradient-to-t from-black/50 to-transparent"></div>
                                    <div className="absolute top-4 right-4 bg-white/90 text-slate-700 text-xs font-bold px-3 py-1.5 rounded-full flex items-center gap-1.5 backdrop-blur-md shadow-sm border border-white/50 opacity-0 group-hover:opacity-100 transition-opacity z-20">
                                        <RotateCcw size={12} /> 點擊翻轉
                                    </div>
                                </div>
                                
                                <div className="flex-1 flex flex-col items-center justify-center p-6 bg-white relative">
                                    {/* 裝飾線 */}
                                    <div className={`absolute top-0 left-1/2 -translate-x-1/2 w-12 h-1.5 rounded-b-lg ${currentWord.color.replace('bg-', 'bg-opacity-80 bg-')}`}></div>
                                    
                                    <div className="text-center w-full">
                                        <p className="text-xl text-slate-400 mb-2 font-medium tracking-wider font-mono">{currentWord.reading}</p>
                                        <div className={`text-5xl font-black mb-8 leading-tight ${currentWord.accentColor} drop-shadow-sm`}>
                                            <FuriganaText text={currentWord.kanji} />
                                        </div>
                                    </div>
                                    
                                    <button 
                                        onClick={(e) => { e.stopPropagation(); speak(currentWord.kanji); }} 
                                        className={`w-16 h-16 flex items-center justify-center rounded-full ${currentWord.color} ${currentWord.accentColor} hover:brightness-95 transition-all active:scale-90 shadow-md border-2 border-white`} 
                                        title="播放發音"
                                    >
                                        <Volume2 size={32} />
                                    </button>
                                </div>
                                <div className="py-3 bg-slate-50 text-center text-slate-400 text-xs font-medium border-t border-slate-100 flex items-center justify-center gap-1">
                                    <Info size={12} /> 查看意思與詳細例句
                                </div>
                            </div>

                            {/* 背面 (Back) */}
                            <div className="absolute w-full h-full backface-hidden rotate-y-180 rounded-3xl card-shadow overflow-hidden border-2 border-slate-100 flex flex-col bg-white">
                                <div className={`h-3 w-full ${currentWord.color.replace('bg-', 'bg-')}`}></div>
                                <div className="flex-1 flex flex-col h-full overflow-hidden">
                                    
                                    {/* 背面頭部 */}
                                    <div className="px-6 pt-6 pb-4 border-b border-slate-50 bg-white z-10">
                                        <div className="flex items-center justify-between mb-2">
                                            <h3 className={`text-2xl font-bold ${currentWord.accentColor} flex items-center gap-2`}>
                                                <FuriganaText text={currentWord.kanji} />
                                            </h3>
                                            <button 
                                                onClick={(e) => { e.stopPropagation(); speak(currentWord.kanji); }} 
                                                className="p-2 rounded-full bg-slate-50 text-slate-400 hover:bg-blue-50 hover:text-blue-500 transition-colors"
                                            >
                                                <Volume2 size={18} />
                                            </button>
                                        </div>
                                        <p className="text-lg text-slate-800 font-bold bg-slate-100 inline-block px-3 py-1 rounded-lg">
                                            {currentWord.meaning}
                                        </p>
                                    </div>

                                    {/* 例句捲動區 */}
                                    <div className="flex-1 overflow-y-auto p-5 custom-scrollbar bg-slate-50/50">
                                        <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
                                            <div className="flex items-center gap-2 mb-4 text-slate-400 font-bold text-xs uppercase tracking-wider">
                                                <BookOpen size={14} />
                                                <span>活用例句與補充</span>
                                            </div>
                                            <div className="text-slate-700 text-base space-y-4">
                                                <FuriganaText text={currentWord.example} showSpeaker={true} speakerColor={currentWord.accentColor} />
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* 控制按鈕 */}
                    <div className="flex items-center gap-4 mt-8">
                        <button onClick={handlePrev} className="w-14 h-14 rounded-full bg-white shadow-lg text-slate-400 hover:text-blue-500 hover:scale-105 transition-all active:scale-95 border border-slate-100 flex items-center justify-center" aria-label="上一個">
                            <ChevronLeft size={28} />
                        </button>
                        
                        <button onClick={() => { setIsFlipped(false); setCurrentIndex(0); }} className="px-6 h-12 rounded-full bg-white shadow-lg text-slate-500 font-bold hover:text-blue-500 hover:scale-105 transition-all active:scale-95 border border-slate-100 flex items-center gap-2">
                            <RotateCcw size={18} />
                            <span>重來</span>
                        </button>
                        
                        <button onClick={handleNext} className="w-14 h-14 rounded-full bg-white shadow-lg text-slate-400 hover:text-blue-500 hover:scale-105 transition-all active:scale-95 border border-slate-100 flex items-center justify-center" aria-label="下一個">
                            <ChevronRight size={28} />
                        </button>
                    </div>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<VocabularySlides />);
    </script>
</body>
</html>
