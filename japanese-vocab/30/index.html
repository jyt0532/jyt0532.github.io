            }

        // 假名標註組件 (Ruby Text)
        const Furigana = ({ text }) => {
            if (!text) return null;
            return (
                <>
                    {text.split('\n').map((line, i) => (
                        <div key={i} className={i > 0 ? "mt-2 pt-2 border-t border-indigo-100/50" : ""}>
                            {(() => {
                                const regex = /([\u4e00-\u9fa5]+)\[(.*?)\]/g;
                                const parts = [];
                                let lastIndex = 0;
                                let match;

                                while ((match = regex.exec(line)) !== null) {
                                    if (match.index > lastIndex) {
                                        parts.push(line.substring(lastIndex, match.index));
                                    }
                                    parts.push(
                                        <ruby key={match.index} className="mx-0.5 font-normal">
                                            {match[1]}
                                            <rt>{match[2]}</rt>
                                        </ruby>
                                    );
                                    lastIndex = regex.lastIndex;
                                }
                                if (lastIndex < line.length) {
                                    parts.push(line.substring(lastIndex));
                                }
                                return <span>{parts}</span>;
                            })()}
                        </div>
                    ))}
                </>
            );
        };

        const App = () => {
            const [currentIndex, setCurrentIndex] = useState(0);
            const [isFlipped, setIsFlipped] = useState(false);
            const word = vocabularyData[currentIndex];

            const speak = useCallback((text) => {
                const cleanText = text.replace(/\[.*?\]/g, ""); // 移除注音
                // 移除括號內的補充說明 (中文) 避免朗讀錯誤
                const jpOnly = cleanText.replace(/\(.*?\)/g, "").replace(/（.*?）/g, "");
                
                const utterance = new SpeechSynthesisUtterance(jpOnly);
                utterance.lang = 'ja-JP';
                utterance.rate = 0.85; // 稍微放慢語速
                window.speechSynthesis.speak(utterance);
            }, []);

            const handleNext = useCallback(() => {
                setIsFlipped(false);
                setTimeout(() => setCurrentIndex((prev) => (prev + 1) % vocabularyData.length), 300);
            }, []);

            const handlePrev = useCallback(() => {
                setIsFlipped(false);
                setTimeout(() => setCurrentIndex((prev) => (prev - 1 + vocabularyData.length) % vocabularyData.length), 300);
            }, []);
            
            // 鍵盤控制
            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === 'ArrowRight') handleNext();
                    if (e.key === 'ArrowLeft') handlePrev();
                    if (e.key === ' ' || e.key === 'Enter') setIsFlipped(prev => !prev);
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [handleNext, handlePrev]);

            return (
                <div className="min-h-screen flex flex-col items-center justify-center p-4 bg-gradient-to-br from-indigo-50 to-blue-100">

                        </div>
                    </div>

                            className={`w-full h-full relative transform-style-3d cursor-pointer card-inner ${isFlipped ? 'rotate-y-180' : ''}`}

                        >
                            {/* 正面 */}
                            <div className="absolute w-full h-full backface-hidden bg-white rounded-3xl shadow-2xl overflow-hidden border border-white flex flex-col">
                                <div className="h-[55%] bg-gray-100 relative overflow-hidden group-hover:brightness-95 transition-all">
                                    <img 
                                        src={`images/${word.image}`} 
                                        alt={word.kanji}
                                        className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105"
                                        onError={(e) => {
                                            e.target.onerror = null;
                                            e.target.src = `https://placehold.co/600x400/e0e7ff/4f46e5?text=${word.kanji}`;
                                        }}
                                    />
                                    <div className="absolute top-3 left-3 bg-black/40 backdrop-blur-md text-white text-xs px-2 py-1 rounded-md border border-white/20">
                                        No. {word.id}
                                    </div>
                                    <div className="absolute bottom-3 right-3 bg-white/90 text-indigo-600 text-xs px-2 py-1 rounded-full shadow-lg flex items-center gap-1">
                                        <Info size={12} /> 點擊翻轉
                                    </div>
                                </div>
                                
                                <div className="flex-1 flex flex-col items-center justify-center p-6 bg-white relative">
                                    <div className="text-center">
                                        <h2 className="text-5xl font-black text-gray-800 mb-3 tracking-wide">{word.kanji}</h2>
                                        <p className="text-xl text-indigo-500 font-bold">{word.reading}</p>
                                    </div>
                                    
                                    <button 
                                        className="absolute bottom-6 p-3 rounded-full bg-indigo-50 text-indigo-600 hover:bg-indigo-100 hover:scale-110 transition-all shadow-sm active:scale-95"
                                        onClick={(e) => { e.stopPropagation(); speak(word.reading); }}
                                    >
                                        <Volume2 size={24} />
                                    </button>
                                </div>
                            </div>

                            {/* 背面 */}
                            <div className="absolute w-full h-full backface-hidden rotate-y-180 bg-white rounded-3xl shadow-2xl overflow-hidden border border-white flex flex-col">
                                <div className="bg-indigo-600 p-6 text-white text-center relative overflow-hidden">
                                    <div className="absolute top-0 left-0 w-full h-full bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iMSIgY3k9IjEiIHI9IjEiIGZpbGw9InJnYmEoMjU1LDI1NSwyNTUsMC4xKSIvPjwvc3ZnPg==')] opacity-30"></div>
                                    <h2 className="text-3xl font-bold mb-2 relative z-10">{word.kanji}</h2>
                                    <p className="opacity-90 text-lg relative z-10 font-medium">{word.meaning}</p>
                                </div>
                                
                                <div className="flex-1 p-6 flex flex-col bg-white overflow-hidden">
                                    <div className="flex items-center gap-2 mb-3 text-indigo-500 font-bold text-sm uppercase tracking-wider">
                                        <BookOpen size={16} />
                                        <span>例句與補充</span>
                                    </div>
                                    
                                    <div className="flex-1 bg-indigo-50/50 rounded-2xl p-5 border border-indigo-100 overflow-y-auto no-scrollbar relative">
                                        <div className="text-xl text-gray-700 leading-relaxed font-medium">
                                            <Furigana text={word.example} />
                                        </div>
                                    </div>

                                    <div className="mt-4 flex justify-center">
                                        <button 
                                            className="flex items-center gap-2 px-6 py-3 rounded-full bg-gray-100 text-gray-600 hover:bg-gray-200 hover:text-gray-900 transition-all active:scale-95 font-medium"
                                            onClick={(e) => { e.stopPropagation(); speak(word.example); }}
                                        >
                                            <Volume2 size={18} />
                                            <span>朗讀例句</span>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="flex items-center gap-6 mt-8 w-full max-w-md justify-center">
                        <button 
                            onClick={handlePrev} 
                            className="p-4 rounded-full bg-white shadow-lg shadow-indigo-100 text-gray-400 hover:text-indigo-600 hover:shadow-xl hover:-translate-y-1 transition-all active:scale-95 active:translate-y-0"
                            title="上一個 (Left Arrow)"
                        >
                            <ChevronLeft size={28} />
                        </button>
                        
                        <button 
                            onClick={() => { setIsFlipped(false); setCurrentIndex(0); }}
                            className="p-4 rounded-full bg-white shadow-lg shadow-indigo-100 text-gray-400 hover:text-indigo-600 hover:shadow-xl hover:-translate-y-1 transition-all active:scale-95 active:translate-y-0"
                            title="重新開始"
                        >
                            <RotateCcw size={24} />
                        </button>

                        <button 
                            onClick={handleNext} 
                            className="p-4 rounded-full bg-white shadow-lg shadow-indigo-100 text-gray-400 hover:text-indigo-600 hover:shadow-xl hover:-translate-y-1 transition-all active:scale-95 active:translate-y-0"
                            title="下一個 (Right Arrow)"
                        >
                            <ChevronRight size={28} />
                        </button>
                    </div>
                    
                    <div className="mt-6 text-xs text-gray-400 text-center">
                        可以使用鍵盤 ← → 切換，空白鍵翻轉
                    </div>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
