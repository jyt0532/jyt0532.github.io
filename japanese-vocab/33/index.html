                id: 42, kanji: "地震[じしん]", reading: "じしん", meaning: "地震", 
                type: "reading", color: "bg-violet-50", accentColor: "text-violet-600", borderColor: "border-violet-200",
                example: "地震[じしん]が起[お]きる。\n(發生地震)"
            },
            { 
                id: 43, kanji: "起[お]きます", reading: "おきます", meaning: "發生", 
                type: "reading", color: "bg-violet-50", accentColor: "text-violet-600", borderColor: "border-violet-200",
                example: "事故[じこ]が起[お]きる。\n(發生事故)"
            },
            { 
                id: 44, kanji: "助[たす]け合[あ]います", reading: "たすけあいます", meaning: "互相幫助", 
                type: "reading", color: "bg-violet-50", accentColor: "text-violet-600", borderColor: "border-violet-200",
                example: "困[こま]った時[とき]は助[たす]け合[あ]いましょう。\n(困難時互相幫助吧)"
            },
            { 
                id: 45, kanji: "元々[もともと]", reading: "もともと", meaning: "原本 / 本來", 
                type: "reading", color: "bg-violet-50", accentColor: "text-violet-600", borderColor: "border-violet-200",
                example: "彼[かれ]は元々[もともと]気が弱[よわ]いです。\n(他原本個性就很軟弱)"
            },
            { 
                id: 46, kanji: "悲[かな]しい", reading: "かなしい", meaning: "悲傷", 
                type: "reading", color: "bg-violet-50", accentColor: "text-violet-600", borderColor: "border-violet-200",
                example: "悲[かな]しいニュースを聞[き]く。\n(聽到悲傷的新聞)"
            },
            { 
                id: 47, kanji: "もっと", reading: "もっと", meaning: "更加", 
                type: "reading", color: "bg-violet-50", accentColor: "text-violet-600", borderColor: "border-violet-200",
                example: "もっと練習[れんしゅう]してください。\n(請多加練習)"
            },
            { 
                id: 48, kanji: "挨拶[あいさつ]", reading: "あいさつ", meaning: "問候 / 打招呼", 
                type: "reading", color: "bg-violet-50", accentColor: "text-violet-600", borderColor: "border-violet-200",
                example: "挨拶[あいさつ]を交[か]わす。\n(互相打招呼)"
            },
            { 
                id: 49, kanji: "相手[あいて]", reading: "あいて", meaning: "對方 / 對象", 
                type: "reading", color: "bg-violet-50", accentColor: "text-violet-600", borderColor: "border-violet-200",
                example: "相談[そうだん]の相手[あいて]。\n(商量的對象)\n相手[あいて]の目[め]を見[み]て話[はな]す。\n(看著對方的眼睛說話)"
            },
            { 
                id: 50, kanji: "気持[きも]ち", reading: "きもち", meaning: "心情 / 心意", 
                type: "reading", color: "bg-violet-50", accentColor: "text-violet-600", borderColor: "border-violet-200",
                example: "気持[きも]ちがいい。\n(心情好/舒服)\n気持[きも]ちを伝[つた]える。\n(傳達心意)"
            }
        ];

        // --- 元件: 帶假名標註的文字 ---
        const FuriganaText = ({ text, className = "", showSpeaker = false, speakerColor = "text-gray-400" }) => {
            const speak = (txt) => {
                let cleanText = txt
                    .replace(/\[.*?\]/g, "")           
                    .replace(/\(.*?\)/g, "")           
                    .replace(/（.*?）/g, "")           
                    .replace(/【.*?】/g, "")
                    .split('\n')[0]; // 只讀日文部分，忽略換行後的中文
                
                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = 'ja-JP';
                utterance.rate = 0.9;
                window.speechSynthesis.cancel();
                window.speechSynthesis.speak(utterance);
            };

            const copyText = (txt) => {
                let cleanText = txt.replace(/\[.*?\]/g, ""); // 複製純文字版(無標註語法)
                navigator.clipboard.writeText(cleanText).then(() => {
                    // 可以加入 toast
                });
            };

            if (!text) return null;
            const lines = text.split('\n');

            return (
                <div className={`space-y-3 ${className}`}>
                    {lines.map((line, lineIndex) => {
                        // 判斷是否為中文翻譯行 (包含括號的行通常是翻譯)
                        const isTranslation = line.trim().startsWith('(') || line.trim().startsWith('（');
                        
                        if (isTranslation) {
                            return (
                                <div key={lineIndex} className="text-sm text-gray-500 ml-10 -mt-2 mb-2 select-text pl-1 cursor-text" onMouseDown={(e) => e.stopPropagation()}>
                                    {line}
                                </div>
                            );
                        }

                        const parts = [];
                        const regex = /([\u3005\u4e00-\u9faf\u3040-\u3096\u30a1-\u30fa]+)\[(.*?)\]/g;
                        let lastIndex = 0;
                        let match;
                        
                        const renderParts = [];
                        while ((match = regex.exec(line)) !== null) {
                            if (match.index > lastIndex) {
                                renderParts.push(<span key={`text-${lineIndex}-${lastIndex}`}>{line.substring(lastIndex, match.index)}</span>);
                            }
                            renderParts.push(
                                <ruby key={`ruby-${lineIndex}-${match.index}`} className="mx-0.5 font-normal">
                                    {match[1]}
                                    <rt className="select-none">{match[2]}</rt>
                                </ruby>
                            );
                            lastIndex = regex.lastIndex;
                        }
                        if (lastIndex < line.length) {
                            renderParts.push(<span key={`text-${lineIndex}-${lastIndex}`}>{line.substring(lastIndex)}</span>);
                        }

                        return (
                            <div key={lineIndex} className={`flex items-start gap-2 group/line ${lineIndex > 0 ? 'pt-1' : ''}`}>
                                <div className="flex-shrink-0 flex gap-1 mt-1">
                                    {showSpeaker && (
                                        <button 
                                            onClick={(e) => { e.stopPropagation(); speak(line); }} 
                                            className={`p-1.5 rounded bg-white shadow-sm border border-gray-100 hover:bg-gray-100 text-blue-500 transition-all opacity-100`} 
                                            title="朗讀"
                                        >
                                            <Volume2 size={16} />
                                        </button>
                                    )}
                                    {showSpeaker && (
                                        <button 
                                            onClick={(e) => { e.stopPropagation(); copyText(line); }} 
                                            className={`p-1.5 rounded bg-white shadow-sm border border-gray-100 hover:bg-gray-100 text-gray-400 hover:text-gray-600 transition-all opacity-100`} 
                                            title="複製文字"
                                        >
                                            <Copy size={16} />
                                        </button>
                                    )}
                                </div>
                                <span className="block flex-1 leading-relaxed text-lg tracking-wide text-gray-800 select-text cursor-text py-0.5" onMouseDown={(e) => e.stopPropagation()}>
                                    {renderParts.length > 0 ? renderParts : line}
                                </span>
                            </div>
                        );
                    })}
                </div>
            );
        };

        const VocabularyCard = () => {
            const [currentIndex, setCurrentIndex] = useState(0);
            const [isFlipped, setIsFlipped] = useState(false);

            const currentWord = vocabularyList[currentIndex];
            const getImageUrl = (id) => `images/vocab_${id}.jpg`;

            const handleNext = useCallback(() => {
                setIsFlipped(false);
                setTimeout(() => setCurrentIndex((prev) => (prev + 1) % vocabularyList.length), 300);
            }, []);

            const handlePrev = useCallback(() => {
                setIsFlipped(false);
                setTimeout(() => setCurrentIndex((prev) => (prev - 1 + vocabularyList.length) % vocabularyList.length), 300);
            }, []);

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === 'ArrowRight') handleNext();
                    if (e.key === 'ArrowLeft') handlePrev();
                    if (e.key === ' ') { e.preventDefault(); setIsFlipped(prev => !prev); }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [handleNext, handlePrev]);

            const speakMain = (text) => {
                let cleanText = text.replace(/\[.*?\]/g, "");
                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = 'ja-JP';
                utterance.rate = 1.0;
                window.speechSynthesis.cancel();
                window.speechSynthesis.speak(utterance);
            };

            return (
                <div className="flex flex-col items-center justify-center min-h-screen bg-slate-100 p-4 font-sans">
                    <div className="mb-6 text-center">
                        <h1 className="text-3xl font-bold text-slate-700 mb-2 flex items-center justify-center gap-2">
                            <BookOpen className="text-blue-500" />
                            大家的日本語 第33課 (50字完整版)
                        </h1>
                        <p className="text-slate-400 text-sm">互動單字記憶卡 ({currentIndex + 1} / {vocabularyList.length})</p>
                    </div>

                    <div className="relative w-full max-w-md h-[700px] perspective-1000 group">
                        <div className="absolute -top-6 left-0 w-full h-1.5 bg-gray-200 rounded-full overflow-hidden">
                            <div 
                                className="h-full bg-blue-500 transition-all duration-300 ease-out" 
                                style={{ width: `${((currentIndex + 1) / vocabularyList.length) * 100}%` }} 
                            />
                        </div>

                        <div 
                            className={`card-container relative w-full h-full transform-style-3d ${isFlipped ? 'rotate-y-180' : ''}`} 
                        >
                            {/* 正面 */}
                            <div 
                                className={`absolute w-full h-full backface-hidden rounded-3xl shadow-xl overflow-hidden border-2 ${currentWord.borderColor} bg-white flex flex-col cursor-pointer`}
                                onClick={() => !window.getSelection().toString() && setIsFlipped(true)}
                            >
                                <div className="h-[40%] w-full bg-slate-200 relative overflow-hidden">
                                    <img 
                                        src={getImageUrl(currentWord.id)} 
                                        alt={currentWord.kanji} 
                                        className="w-full h-full object-cover transition-transform duration-700 hover:scale-105"
                                        onError={(e) => { 
                                            e.target.onerror = null; 
                                            e.target.src = `https://placehold.co/600x400/f1f5f9/94a3b8?text=${encodeURIComponent(currentWord.kanji.replace(/\[.*?\]/g, ''))}`; 
                                        }} 
                                    />
                                    <div className="absolute top-4 right-4 bg-black/40 backdrop-blur-md text-white text-xs px-3 py-1.5 rounded-full flex items-center gap-1.5 opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                                        <Lightbulb size={14} /> 點擊翻轉
                                    </div>
                                    <div className={`absolute top-4 left-4 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider bg-white/90 backdrop-blur-sm shadow-sm ${currentWord.accentColor}`}>
                                        {currentWord.type ? currentWord.type.toUpperCase() : "WORD"}
                                    </div>
                                </div>
                                
                                <div className={`flex-1 flex flex-col items-center justify-center p-6 relative ${currentWord.color} bg-opacity-30`}>
                                    <div className="text-center w-full">
                                        <p className="text-xl text-slate-500 mb-2 font-medium tracking-wider">{currentWord.reading}</p>
                                        <div className={`text-5xl font-black mb-8 ${currentWord.accentColor} filter drop-shadow-sm select-text cursor-text`} onMouseDown={(e) => e.stopPropagation()}>
                                            <FuriganaText text={currentWord.kanji} />
                                        </div>
                                        <button 
                                            onClick={(e) => { e.stopPropagation(); speakMain(currentWord.kanji); }} 
                                            className={`mx-auto p-4 rounded-full bg-white shadow-lg shadow-blue-100 text-slate-600 hover:text-blue-600 hover:scale-110 transition-all active:scale-95 flex items-center justify-center`}
                                        >
                                            <Volume2 size={32} />
                                        </button>
                                    </div>
                                </div>
                                <div className="py-3 bg-white text-center text-slate-400 text-xs border-t border-slate-100">
                                    空白鍵翻轉 • 左右鍵切換 • 滑鼠選取可複製
                                </div>
                            </div>

                            {/* 背面 */}
                            <div 
                                className={`absolute w-full h-full backface-hidden rotate-y-180 rounded-3xl shadow-xl overflow-hidden border-2 border-slate-200 bg-white flex flex-col`}
                                
                            >
                                <div className={`h-2.5 w-full ${currentWord.accentColor.replace('text-', 'bg-')}`}></div>
                                
                                <div className="flex-1 flex flex-col h-full overflow-hidden relative">
                                    <div className="absolute top-0 right-0 p-4 z-10 cursor-pointer" onClick={() => setIsFlipped(false)}>
                                         <RotateCcw size={18} className="text-gray-300 hover:text-gray-500" />
                                    </div>

                                    <div className="p-6 pb-2 text-center border-b border-slate-50">
                                        <h3 className={`text-3xl font-bold mb-2 ${currentWord.accentColor} flex items-center justify-center gap-3 select-text cursor-text`} onMouseDown={(e) => e.stopPropagation()}>
                                            <span className="truncate max-w-[200px]">{currentWord.kanji.replace(/\[.*?\]/g, '')}</span>
                                            <button 
                                                onClick={(e) => { e.stopPropagation(); speakMain(currentWord.kanji); }} 
                                                className="p-2 rounded-full bg-slate-100 text-slate-500 hover:bg-slate-200 transition-colors"
                                            >
                                                <Volume2 size={18} />
                                            </button>
                                        </h3>
                                        <p className="text-lg text-slate-700 font-bold bg-slate-50 inline-block px-4 py-1 rounded-lg select-text cursor-text" onMouseDown={(e) => e.stopPropagation()}>
                                            {currentWord.meaning}
                                        </p>
                                    </div>
                                    
                                    <div className="flex-1 overflow-y-auto p-4 custom-scrollbar">
                                        <div className={`rounded-xl p-5 border ${currentWord.borderColor} ${currentWord.color} bg-opacity-40`}>
                                            <div className={`flex items-center gap-2 mb-4 text-xs font-bold uppercase tracking-widest ${currentWord.accentColor} opacity-70`}>
                                                <Star size={14} />
                                                <span>例句與補充 (可複製)</span>
                                            </div>
                                            <div className="space-y-1">
                                                <FuriganaText 
                                                    text={currentWord.example} 
                                                    showSpeaker={true} 
                                                    speakerColor={currentWord.accentColor} 
                                                />
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="flex items-center gap-6 mt-8">
                        <button onClick={handlePrev} className="p-4 rounded-full bg-white shadow-md text-slate-400 hover:text-blue-500 hover:shadow-xl transition-all active:scale-95 border border-slate-100" aria-label="上一個">
                            <ChevronLeft size={28} />
                        </button>
                        
                        <button onClick={() => { setIsFlipped(false); setCurrentIndex(0); }} className="flex items-center gap-2 px-6 py-3 rounded-full bg-white shadow-md text-slate-500 font-medium hover:text-blue-600 hover:shadow-xl transition-all active:scale-95 border border-slate-100 group">
                            <RotateCcw size={18} className="group-hover:-rotate-180 transition-transform duration-500" />
                            <span>重新開始</span>
                        </button>
                        
                        <button onClick={handleNext} className="p-4 rounded-full bg-white shadow-md text-slate-400 hover:text-blue-500 hover:shadow-xl transition-all active:scale-95 border border-slate-100" aria-label="下一個">
                            <ChevronRight size={28} />
                        </button>
                    </div>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<VocabularyCard />);
    </script>
</body>
</html>
